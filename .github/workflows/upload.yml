name: Publish Python Package

# Публикация на PyPI через Trusted Publishing (OIDC) — секреты и токены не нужны.
#
# Разовая настройка на стороне PyPI (Account → Publishing → Add a new pending publisher):
#   PyPI Project Name: remnactual
#   Owner:             IceOne-i
#   Repository name:   remnactual
#   Workflow name:     upload.yml
#   Environment name:  pypi
#
# Сборка и проверки идут через uv; poetry в проекте не используется.
#
# Версия НЕ хранится в репозитории: hatch-vcs выводит её из
# git-тега. Единственное действие для релиза — повесить тег на коммит и запушить.
# Пуш в ветку без тега публикацию не запускает.
#
#   git tag v3.0.1 && git push origin v3.0.1

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs выводит версию через git describe,
          # поэтому нужны вся история и теги
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run the offline test suite
        run: |
          uv run --group dev pytest -p no:cacheprovider -q \
            tests/test_3_0_compliance.py tests/test_3_2_compliance.py \
            tests/test_3_2_3_compliance.py tests/test_3_3_compliance.py \
            tests/test_3_4_compliance.py tests/test_3_4_4_compliance.py \
            tests/test_3_4_7_compliance.py \
            tests/test_rapid_compatibility.py \
            tests/test_models_validation.py tests/test_enums.py \
            tests/test_controllers_completeness.py

      - name: Build distributions
        run: uv build

      - name: Validate metadata
        run: uv run --group dev twine check dist/*

      - name: Check that the built version equals the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built="$(ls dist/*.tar.gz | sed -E 's#.*/remnactual-(.+)\.tar\.gz#\1#')"
          echo "tag: $tag | built: $built"
          if [ "$built" != "$tag" ]; then
            echo "::error::Built version $built does not match tag $GITHUB_REF_NAME."
            echo "::error::A dev-suffixed version means the tag was not visible to git describe."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # Релиз создаётся только для тега и только после успешной публикации на PyPI.
    needs: publish-pypi
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            dist/*
